# ElectionAI v0.3 reproducible historical research pipeline (fallback-enabled)
name: historical-backtest

on:
  workflow_dispatch:
    inputs:
      draws:
        description: Posterior draws per snapshot
        required: false
        default: "4000"
      years:
        description: Space separated scoreable election years
        required: false
        default: "2014 2018 2022"
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-backtest.yml"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BACKTEST_DRAWS: ${{ inputs.draws || '3000' }}
      BACKTEST_YEARS: ${{ inputs.years || '2014 2018 2022' }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare reproducible synthetic fixtures
        run: |
          python scripts/generate_demo_data.py
          python scripts/train.py
      - name: Unit tests
        run: pytest -q
      - name: Fetch official and published historical data
        run: python scripts/fetch_historical_data.py --years 2010 2014 2018 2022
      - name: Run leakage-safe backtests
        shell: bash
        run: python scripts/run_historical_backtest.py --years $BACKTEST_YEARS --draws $BACKTEST_DRAWS
      - name: Run baselines and ablation study
        shell: bash
        run: python scripts/run_model_comparison.py --years $BACKTEST_YEARS --draws $BACKTEST_DRAWS
      - name: Generate publication figures
        run: python scripts/generate_paper_figures.py
      - name: Populate paper with empirical results
        run: python scripts/build_paper_draft.py
      - name: Publish research artifact
        uses: actions/upload-artifact@v4
        with:
          name: electionai-research-results-${{ github.run_id }}
          path: |
            reports/historical_backtest/
            reports/model_comparison/
            paper/figures/
            paper/generated/
          retention-days: 30
