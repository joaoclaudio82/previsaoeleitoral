# ElectionAI v0.3 reproducible historical research pipeline
name: historical-backtest

on:
  workflow_dispatch:
    inputs:
      draws:
        description: Posterior draws per snapshot
        required: false
        default: "4000"
      years:
        description: Space separated scoreable election years
        required: false
        default: "2014 2018 2022"
  push:
    branches: [main]
    paths:
      - "data/historical_frozen/**"
      - "app/data/historical_snapshots.py"
      - "app/data/historical_state_priors.py"
      - "app/ml/historical_backtest.py"
      - "app/ml/historical_baselines.py"
      - "app/ml/dynamic_polling.py"
      - "app/ml/geographic_baseline.py"
      - "app/ml/posterior_predictive.py"
      - "app/ml/robustness.py"
      - "app/services/hierarchical_polls.py"
      - "scripts/prepare_frozen_historical.py"
      - "scripts/run_historical_backtest.py"
      - "scripts/run_model_comparison.py"
      - "scripts/run_state_prior_ablation.py"
      - "scripts/run_robustness_suite.py"
      - "scripts/generate_paper_figures.py"
      - "scripts/build_paper_draft.py"
      - "tests/test_dynamic_polling.py"
      - "tests/test_geographic_baseline.py"
      - "tests/test_robustness.py"
      - ".github/workflows/historical-backtest.yml"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BACKTEST_DRAWS: ${{ inputs.draws || '3000' }}
      ROBUSTNESS_DRAWS: "2000"
      BACKTEST_YEARS: ${{ inputs.years || '2014 2018 2022' }}
      BACKTEST_OFFSETS: "15 7 3 1"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare reproducible synthetic fixtures
        run: |
          python scripts/generate_demo_data.py
          python scripts/train.py
      - name: Unit tests
        run: pytest -q
      - name: Materialize frozen historical dataset
        run: python scripts/prepare_frozen_historical.py
      - name: Run leakage-safe backtests
        shell: bash
        run: python scripts/run_historical_backtest.py --years $BACKTEST_YEARS --offsets $BACKTEST_OFFSETS --draws $BACKTEST_DRAWS
      - name: Run polling baselines
        shell: bash
        run: python scripts/run_model_comparison.py --years $BACKTEST_YEARS --offsets $BACKTEST_OFFSETS --draws $BACKTEST_DRAWS
      - name: Run symmetric state-prior ablation
        shell: bash
        run: python scripts/run_state_prior_ablation.py --years $BACKTEST_YEARS --offsets $BACKTEST_OFFSETS --draws $BACKTEST_DRAWS
      - name: Run cross-election robustness suite
        shell: bash
        run: python scripts/run_robustness_suite.py --years $BACKTEST_YEARS --offsets $BACKTEST_OFFSETS --draws $ROBUSTNESS_DRAWS
      - name: Generate publication figures
        run: python scripts/generate_paper_figures.py
      - name: Populate paper with empirical results
        run: python scripts/build_paper_draft.py
      - name: Publish research artifact
        uses: actions/upload-artifact@v4
        with:
          name: electionai-research-results-${{ github.run_id }}
          path: |
            data/historical/manifest.json
            reports/historical_backtest/
            reports/model_comparison/
            reports/state_prior_ablation/
            reports/robustness/
            paper/figures/
            paper/generated/
          retention-days: 30
