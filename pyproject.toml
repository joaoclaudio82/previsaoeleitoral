[project]
name = "election-ai"
version = "0.3.0"
description = "Plataforma probabilística com modelo eleitoral Bayesiano hierárquico e backtesting histórico"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
